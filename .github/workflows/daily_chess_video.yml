name: Daily Chess Video Auto-Publish

permissions:
  contents: write

on:
  schedule:
    # Runs daily at 12:00 PM UTC (5:30 PM IST)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger with 1 click
    inputs:
      upload_youtube:
        description: 'Upload to YouTube? (auto = every day, true = force yes, false = force skip)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 'true'
          - 'false'
      dry_run:
        description: 'Generate only (skip YouTube and Facebook uploads)?'
        required: false
        default: false
        type: boolean

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 stockfish fonts-dejavu-core fonts-freefont-ttf fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📅 Check YouTube upload schedule (Daily)
        id: yt_schedule
        run: |
          INPUT_CHOICE="${{ github.event.inputs.upload_youtube }}"
          if [ "$INPUT_CHOICE" = "false" ]; then
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            echo "Manual override: YouTube upload forced to FALSE."
          else
            echo "should_upload=true" >> "$GITHUB_OUTPUT"
            echo "✅ Daily schedule: YouTube upload enabled."
          fi

      - name: Run Daily Video & Thumbnail Generator
        env:
          UPLOAD_YOUTUBE: ${{ steps.yt_schedule.outputs.should_upload }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GAME_SOURCE: auto
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python daily_runner.py

      - name: Archive Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-chess-video
          path: |
            recordings/*.mp4
            recordings/*.png
            recordings/*.srt
            recordings/chapters.json

      - name: Persist game history (no repeats)
        continue-on-error: true
        run: |
          if [ -f used_games.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add used_games.json
            if ! git diff --cached --quiet; then
              git commit -m "Update used games history [skip ci]"
              git pull --rebase origin main
              git push
            fi
          fi
